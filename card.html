<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Business Card</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="view-wrap" id="view-wrap">
  <!-- filled by script -->
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
function decodeCard(b64){
  let s = b64.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length % 4) s += '=';
  const json = decodeURIComponent(escape(atob(s)));
  const p = JSON.parse(json);
  return {
    name:p.n, title:p.t, company:p.c, email:p.e,
    phone:p.p, mobile:p.m, website:p.w, bio:p.b
  };
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function contactRowsOverlay(card){
  const rows = [];
  if(card.email)   rows.push(`<div class="tpl-row email"><span>${escapeHtml(card.email)}</span></div>`);
  if(card.phone)   rows.push(`<div class="tpl-row phone"><span>${escapeHtml(card.phone)}</span></div>`);
  if(card.mobile)  rows.push(`<div class="tpl-row mobile"><span>${escapeHtml(card.mobile)}</span></div>`);
  if(card.website) rows.push(`<div class="tpl-row website"><span>${escapeHtml(card.website)}</span></div>`);
  return rows.join('');
}

function vCardText(card){
  return [
    'BEGIN:VCARD','VERSION:3.0',
    `FN:${card.name || ''}`,
    card.title ? `TITLE:${card.title}` : '',
    card.company ? `ORG:${card.company}` : '',
    card.email ? `EMAIL:${card.email}` : '',
    card.phone ? `TEL;TYPE=WORK:${card.phone}` : '',
    card.mobile ? `TEL;TYPE=CELL:${card.mobile}` : '',
    card.website ? `URL:${card.website}` : '',
    card.bio ? `NOTE:${card.bio}` : '',
    'END:VCARD'
  ].filter(Boolean).join('\n');
}

function downloadVCard(card){
  const blob = new Blob([vCardText(card)], {type:'text/vcard'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${(card.name || 'contact').replace(/\s+/g,'_')}.vcf`;
  a.click();
  URL.revokeObjectURL(url);
}

const root = document.getElementById('view-wrap');
const params = new URLSearchParams(window.location.search);
const d = params.get('d');

if(!d){
  root.innerHTML = `
    <div class="big-card">
      <h1 style="font-size:24px">No card here</h1>
      <p class="not-found">This link doesn't include any card data. Head back to the tray to create and share a card.</p>
      <div class="view-actions">
        <a class="btn primary" href="index.html">Open Cardtray</a>
      </div>
    </div>`;
} else {
  let card;
  try{
    card = decodeCard(d);
  }catch(e){
    root.innerHTML = `
      <div class="big-card">
        <h1 style="font-size:22px">Couldn't read this card</h1>
        <p class="not-found">The link looks corrupted or incomplete. Ask the sender to resend it.</p>
      </div>`;
    card = null;
  }

  if(card){
    root.innerHTML = `
      <div class="big-flip-slot" id="flip-slot">
        <div class="card-flip">
          <div class="card-face front">
            <div class="tpl-qr-badge">
              <div class="qr-wrap" id="qr"></div>
              <span class="cap">Tap to flip</span>
            </div>
          </div>
          <div class="card-face back">
            <div class="tpl-id">
              <h3>${escapeHtml(card.name)}</h3>
              <p class="role">${escapeHtml(card.title || '')}</p>
            </div>
            <div class="tpl-contacts">${contactRowsOverlay(card)}</div>
          </div>
        </div>
      </div>
      <p class="flip-instruction">Tap the card to flip it</p>

      ${card.bio ? `
      <div class="big-card" style="margin-top:22px; text-align:left; padding:22px 24px;">
        <p class="bio" style="margin-top:0">${escapeHtml(card.bio)}</p>
      </div>` : ''}

      <div class="view-actions">
        <button class="btn primary" id="save-btn">Save to contacts</button>
        <button class="btn ghost" id="copy-btn">Copy link</button>
      </div>
    `;

    new QRCode(document.getElementById('qr'), {
      text: window.location.href,
      width: 108,
      height: 108,
      colorDark: '#115C71',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });

    document.getElementById('flip-slot').addEventListener('click', function(){
      this.classList.toggle('flipped');
    });

    document.getElementById('save-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      downloadVCard(card);
    });
    document.getElementById('copy-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      navigator.clipboard.writeText(window.location.href).then(() => {
        e.target.textContent = 'Copied!';
        setTimeout(()=> e.target.textContent = 'Copy link', 1500);
      });
    });
  }
}
</script>
</body>
</html>
